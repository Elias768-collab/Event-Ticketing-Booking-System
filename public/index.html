
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover events and book your tickets.">
  <title>VenueLink | Discover Events</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script type="module" src="./js/pages/home.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html">VenueLink</a>
    <nav aria-label="Main navigation">
      <a href="./index.html" aria-current="page">Discover Events</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">YOUR NEXT EXPERIENCE STARTS RIGHT HERE</p>
      <h1>Discover events that suit your passion and worth attending.</h1>
      <p>Find experiences, explore ticket options and secure your spot.</p>
    </section>

    <section class="search-section" aria-labelledby="search-heading">
      <h2 id="search-heading">Find your next event</h2>

      <form id="filter-form" class="filter-form">
        <div class="form-group">
          <label for="search">Search events</label>
          <input
            id="search"
            name="q"
            type="search"
            placeholder="Search by event or venue"
          >
        </div>

        <div class="form-group">
          <label for="city">City</label>
          <input
            id="city"
            name="city"
            type="text"
            placeholder="e.g. Lagos"
          >
        </div>

        <div class="form-group">
          <label for="max-price">Maximum ticket price (₦)</label>
          <input
            id="max-price"
            name="maxPrice"
            type="number"
            min="0"
            step="1"
            placeholder="e.g. 5000"
          >
        </div>

        <div class="form-group">
          <label for="sort">Sort events by</label>
          <select id="sort" name="sortBy">
            <option value="date">Date</option>
            <option value="price">Lowest price</option>
            <option value="availability">Availability</option>
          </select>
        </div>

        <div class="form-group checkbox-group">
          <input id="available" name="onlyAvailable" type="checkbox">
          <label for="available">Show available events only</label>
        </div>

        <button class="button button-primary" type="submit">
          Apply filters
        </button>

        <button class="button button-secondary" id="reset-filters" type="reset">
          Clear filters
        </button>
      </form>
    </section>

    <section class="events-section" aria-labelledby="events-heading">
      <div class="section-heading">
        <h2 id="events-heading">Upcoming events</h2>
        <p id="results-count" aria-live="polite"></p>
      </div>

      <div id="event-list" class="event-grid" aria-live="polite">
        <p>Loading events...</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>VenueLink — Discover. Book. Experience.</p>
  </footer>
</body>
</html>
